<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Flappy Bird</title>
<link rel="stylesheet" href="flappy.css">
<script src="flappy.js" defer></script>
</head>
<body>

<div id="welcomeScreen">
    

    <input type="file" id="birdUpload" accept="image/png, image/*" style="display:none;">
    <button id="uploadButton">Upload Your Bird</button>

    <button id="startButton">Start Game</button>
</div>

<div id="gameScreen" style="display:none;">
    <canvas id="board" width="360" height="640"></canvas>
    <button id="restartButton" style="display:none;">Restart Game</button>
</div>

</body>
</html>
